name: Update profile art

# Refreshes the contribution heatmap and stats SVGs daily with live data.
# Runs daily on schedule, on manual trigger (workflow_dispatch), and on push to main.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape live GitHub contributions
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render Neofetch info card SVG
        run: python scripts/make_info_card.py

      - name: Render stats / streak card SVG
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg stats.svg"
